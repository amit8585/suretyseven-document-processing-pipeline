services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surety
      POSTGRES_PASSWORD: surety
      POSTGRES_DB: suretyseven
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surety -d suretyseven"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://surety:surety@postgres:5432/suretyseven
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080,http://localhost:3000
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      PROCESSOR_SCENARIO: SUCCESS
      PROCESSOR_DELAY_MS: 800
      MAX_PROCESSING_ATTEMPTS: 3
      RETRY_BACKOFF_MS: 1000
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://surety:surety@postgres:5432/suretyseven
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      PROCESSOR_SCENARIO: SUCCESS
      PROCESSOR_DELAY_MS: 800
      MAX_PROCESSING_ATTEMPTS: 3
      RETRY_BACKOFF_MS: 1000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
