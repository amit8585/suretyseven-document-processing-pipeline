<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#f4f7fb"/>
  <text x="700" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">SuretySeven Document Processing Pipeline</text>
  <text x="700" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#627d98">Modular monolith: Express API + BullMQ worker + React UI</text>

  <rect x="80" y="120" width="220" height="80" rx="12" fill="#102a43"/>
  <text x="190" y="155" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">React UI (Vite)</text>
  <text x="190" y="178" text-anchor="middle" font-family="Arial" font-size="12" fill="#bcccdc">Upload, list, details</text>

  <path d="M300 160 H430" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="430" y="120" width="250" height="80" rx="12" fill="#0f766e"/>
  <text x="555" y="155" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">Express API</text>
  <text x="555" y="178" text-anchor="middle" font-family="Arial" font-size="12" fill="#ccfbf1">POST/GET /documents</text>

  <path d="M555 200 V260" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M680 160 H790" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M555 200 V330 H310" stroke="#102a43" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="80" y="300" width="220" height="80" rx="12" fill="#243b53"/>
  <text x="190" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">Local file storage</text>
  <text x="190" y="358" text-anchor="middle" font-family="Arial" font-size="12" fill="#bcccdc">uploads/*.pdf</text>

  <rect x="430" y="270" width="250" height="80" rx="12" fill="#334e68"/>
  <text x="555" y="305" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">PostgreSQL</text>
  <text x="555" y="328" text-anchor="middle" font-family="Arial" font-size="12" fill="#d9e2ec">documents + history</text>

  <rect x="790" y="120" width="230" height="80" rx="12" fill="#7c3aed"/>
  <text x="905" y="155" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">Redis / BullMQ</text>
  <text x="905" y="178" text-anchor="middle" font-family="Arial" font-size="12" fill="#ede9fe">async jobs, 3 attempts</text>

  <path d="M905 200 V270" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="270" width="230" height="80" rx="12" fill="#b45309"/>
  <text x="905" y="305" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">Document Worker</text>
  <text x="905" y="328" text-anchor="middle" font-family="Arial" font-size="12" fill="#fef3c7">separate Node process</text>

  <path d="M905 350 V420" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M790 310 H680" stroke="#334e68" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M190 380 V500 H790" stroke="#243b53" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="790" y="430" width="230" height="80" rx="12" fill="#1d4ed8"/>
  <text x="905" y="465" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">Mock Processor</text>
  <text x="905" y="488" text-anchor="middle" font-family="Arial" font-size="12" fill="#dbeafe">SUCCESS / TIMEOUT / ERROR</text>

  <path d="M905 510 V580" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="590" width="230" height="80" rx="12" fill="#047857"/>
  <text x="905" y="625" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">Zod Validation</text>
  <text x="905" y="648" text-anchor="middle" font-family="Arial" font-size="12" fill="#d1fae5">PROCESSED or FAILED</text>

  <path d="M790 630 H555 V350" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="80" y="590" width="600" height="90" rx="12" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="380" y="625" text-anchor="middle" font-family="Arial" font-size="14" fill="#102a43">Lifecycle: UPLOADED ’ PROCESSING ’ PROCESSED</text>
  <text x="380" y="652" text-anchor="middle" font-family="Arial" font-size="14" fill="#102a43">or PROCESSING ’ FAILED (retry TIMEOUT / PROCESSOR_ERROR up to 3 attempts)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
